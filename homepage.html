<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background: linear-gradient(to right, #e2e2e2, #c9d6ff);
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: #574b90;
      color: white;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      position: fixed;
      height: 100%;
      transition: transform 0.3s ease-in-out;
    }

    .sidebar a {
      text-decoration: none;
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 1.2rem;
      transition: background-color 0.3s;
    }

    .sidebar a:hover {
      background-color: #6c63ff;
    }

    /* Main content */
    .main-content {
      margin-left: 250px;
      padding: 20px;
      flex-grow: 1;
      overflow: auto;
    }

    .header {
      background-color: #574b90;
      color: white;
      padding: 10px 20px;
      text-align: right;
      font-size: 1.2rem;
      border-radius: 10px;
    }

    .container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 800px;
      margin: 30px auto;
      text-align: left;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .info {
      margin-bottom: 20px;
    }

    .info div {
      margin: 10px 0;
      font-size: 1rem;
      color: #555;
    }

    .info span {
      font-weight: 600;
      color: #222;
      font-size: 1.1rem;
    }

    button {
      background-color: #6c63ff;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #574b90;
    }

    /* Media Queries for responsiveness */
    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
      }

      .main-content {
        margin-left: 200px;
      }

      .header {
        text-align: left;
      }

      .container {
        padding: 20px;
        margin: 10px;
      }
    }

    @media (max-width: 500px) {
      .sidebar {
        width: 150px;
      }

      .main-content {
        margin-left: 150px;
      }
    }
  </style>
  <script type="module" src="./homepage.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2 style="text-align: center; color: white;">Dashboard</h2>
    <a href="#">Home</a>
    <a href="#">Settings</a>
    <a href="#">Profile</a>
    <a href="timesheet.html">Timesheet</a>

  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="header">
      Welcome
    </div>
    <div class="container">
      <h1>Welcome to Your Dashboard</h1>
      <div class="info">
        <div>First Name: <span id="loggedUserFName"></span></div>
        <div>Last Name: <span id="loggedUserLName"></span></div>
        <div>Email: <span id="loggedUserEmail"></span></div>
      </div>
      <button id="logout">Logout</button>
    </div>
  </div>

</body>
</html>
